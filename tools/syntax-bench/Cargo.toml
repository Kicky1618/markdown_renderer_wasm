[package]
name = "streamdown-syntax-bench"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "syntax-bench"
path = "src/main.rs"

[dependencies]
stream-mecab = { path = "../../stream_mecab" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
