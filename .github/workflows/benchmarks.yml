name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      runs:
        description: Repetitions used for the local median
        required: false
        default: "7"

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCH_RUNS: ${{ inputs.runs || '7' }}
      SYNTAX_BENCH_BYTES: "4194304"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Detect benchmark-relevant changes
        id: benchmark-change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          parser_head_hash="$(python3 scripts/benchmark-input-hash.py . --commit "$head_sha" --suite parser)"
          syntax_head_hash="$(python3 scripts/benchmark-input-hash.py . --commit "$head_sha" --suite syntax)"
          base_sha=""
          parser_base_hash=""
          syntax_base_hash=""
          parser_changed=true
          syntax_changed=true

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              ;;
            push)
              base_sha="$PUSH_BEFORE_SHA"
              if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
                base_sha=""
              fi
              ;;
            workflow_dispatch)
              # Manual runs are explicit benchmark requests and always execute both suites.
              base_sha=""
              ;;
          esac

          if [[ -n "$base_sha" ]]; then
            git fetch --no-tags --depth=1 origin "$base_sha"
            parser_base_hash="$(python3 scripts/benchmark-input-hash.py . --commit "$base_sha" --suite parser)"
            syntax_base_hash="$(python3 scripts/benchmark-input-hash.py . --commit "$base_sha" --suite syntax)"
            [[ "$parser_head_hash" != "$parser_base_hash" ]] || parser_changed=false
            [[ "$syntax_head_hash" != "$syntax_base_hash" ]] || syntax_changed=false
          fi

          changed=false
          if [[ "$parser_changed" == true || "$syntax_changed" == true ]]; then
            changed=true
          fi

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "parser_head_hash=$parser_head_hash" >> "$GITHUB_OUTPUT"
          echo "parser_base_hash=$parser_base_hash" >> "$GITHUB_OUTPUT"
          echo "syntax_head_hash=$syntax_head_hash" >> "$GITHUB_OUTPUT"
          echo "syntax_base_hash=$syntax_base_hash" >> "$GITHUB_OUTPUT"
          echo "parser_changed=$parser_changed" >> "$GITHUB_OUTPUT"
          echo "syntax_changed=$syntax_changed" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          echo "BENCH_PARSER_HEAD_HASH=$parser_head_hash" >> "$GITHUB_ENV"
          echo "BENCH_PARSER_BASE_HASH=$parser_base_hash" >> "$GITHUB_ENV"
          echo "BENCH_SYNTAX_HEAD_HASH=$syntax_head_hash" >> "$GITHUB_ENV"
          echo "BENCH_SYNTAX_BASE_HASH=$syntax_base_hash" >> "$GITHUB_ENV"
          echo "BENCH_PARSER_CHANGED=$parser_changed" >> "$GITHUB_ENV"
          echo "BENCH_SYNTAX_CHANGED=$syntax_changed" >> "$GITHUB_ENV"

          echo "Parser: head=$parser_head_hash base=${parser_base_hash:-none} changed=$parser_changed"
          echo "Syntax: head=$syntax_head_hash base=${syntax_base_hash:-none} changed=$syntax_changed"

      - name: Skip unchanged benchmark inputs
        if: steps.benchmark-change.outputs.changed != 'true'
        run: |
          {
            echo '## Benchmarks skipped'
            echo
            echo 'Neither parser nor syntax benchmark inputs changed from the base revision.'
            echo 'No compilation, measurement, Bencher metric, or artifact was produced for this revision.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select stable Rust
        if: steps.benchmark-change.outputs.changed == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Compute Rust cache key
        if: steps.benchmark-change.outputs.changed == 'true'
        id: rust-cache
        run: |
          tag="$(rustc -vV | sha256sum | cut -c1-16)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore parser binary cache
        if: steps.benchmark-change.outputs.parser_changed == 'true'
        id: parser-head-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/bench-bin-parser-${{ steps.benchmark-change.outputs.parser_head_hash }}
          key: bench-bin-v4-parser-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.tag }}-${{ steps.benchmark-change.outputs.parser_head_hash }}

      - name: Restore syntax binary cache
        if: steps.benchmark-change.outputs.syntax_changed == 'true'
        id: syntax-head-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/bench-bin-syntax-${{ steps.benchmark-change.outputs.syntax_head_hash }}
          key: bench-bin-v4-syntax-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.tag }}-${{ steps.benchmark-change.outputs.syntax_head_hash }}

      - name: Install Bencher CLI
        if: steps.benchmark-change.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: bencherdev/bencher@v0.6.12

      - name: Require Bencher API key
        if: steps.benchmark-change.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: test -n "$BENCHER_API_KEY"

      - name: Resolve Bencher project
        if: steps.benchmark-change.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          project="$(python3 scripts/resolve-bencher-project.py)"
          echo "Resolved Bencher project: $project"
          echo "BENCHER_PROJECT=$project" >> "$GITHUB_ENV"

      - name: Resolve benchmark testbed
        if: steps.benchmark-change.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          testbed="$(python3 scripts/resolve-bencher-testbed.py)"
          echo "Bencher testbed: $testbed"
          echo "BENCHER_TESTBED=$testbed" >> "$GITHUB_ENV"

      - name: Build changed benchmark binaries
        if: steps.benchmark-change.outputs.changed == 'true' && ((steps.benchmark-change.outputs.parser_changed == 'true' && steps.parser-head-cache.outputs.cache-hit != 'true') || (steps.benchmark-change.outputs.syntax_changed == 'true' && steps.syntax-head-cache.outputs.cache-hit != 'true'))
        env:
          PARSER_CACHE_HIT: ${{ steps.parser-head-cache.outputs.cache-hit }}
          SYNTAX_CACHE_HIT: ${{ steps.syntax-head-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          pids=()
          labels=()

          if [[ "$BENCH_PARSER_CHANGED" == true && "$PARSER_CACHE_HIT" != true ]]; then
            (
              CARGO_TARGET_DIR="${RUNNER_TEMP}/bench-target-parser" \
                cargo build --release --bin stream-bench
              bin_dir="${RUNNER_TEMP}/bench-bin-parser-${BENCH_PARSER_HEAD_HASH}"
              mkdir -p "$bin_dir"
              cp "${RUNNER_TEMP}/bench-target-parser/release/stream-bench" "$bin_dir/stream-bench"
            ) &
            pids+=("$!")
            labels+=(parser)
          fi

          if [[ "$BENCH_SYNTAX_CHANGED" == true && "$SYNTAX_CACHE_HIT" != true ]]; then
            (
              CARGO_TARGET_DIR="${RUNNER_TEMP}/bench-target-syntax" \
                cargo build --release --manifest-path tools/syntax-bench/Cargo.toml
              bin_dir="${RUNNER_TEMP}/bench-bin-syntax-${BENCH_SYNTAX_HEAD_HASH}"
              mkdir -p "$bin_dir"
              cp "${RUNNER_TEMP}/bench-target-syntax/release/syntax-bench" "$bin_dir/syntax-bench"
            ) &
            pids+=("$!")
            labels+=(syntax)
          fi

          failed=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "::error::${labels[$i]} benchmark build failed"
              failed=1
            fi
          done
          exit "$failed"

      - name: Restore pull-request base parser binary cache
        if: github.event_name == 'pull_request' && steps.benchmark-change.outputs.parser_changed == 'true'
        id: parser-base-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/bench-bin-parser-${{ steps.benchmark-change.outputs.parser_base_hash }}
          key: bench-bin-v4-parser-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.tag }}-${{ steps.benchmark-change.outputs.parser_base_hash }}

      - name: Restore pull-request base syntax binary cache
        if: github.event_name == 'pull_request' && steps.benchmark-change.outputs.syntax_changed == 'true'
        id: syntax-base-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/bench-bin-syntax-${{ steps.benchmark-change.outputs.syntax_base_hash }}
          key: bench-bin-v4-syntax-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.tag }}-${{ steps.benchmark-change.outputs.syntax_base_hash }}

      - name: Prepare pull-request base worktree
        if: github.event_name == 'pull_request' && ((steps.benchmark-change.outputs.parser_changed == 'true' && steps.parser-base-cache.outputs.cache-hit != 'true') || (steps.benchmark-change.outputs.syntax_changed == 'true' && steps.syntax-base-cache.outputs.cache-hit != 'true'))
        env:
          BASE_SHA: ${{ steps.benchmark-change.outputs.base_sha }}
        run: git worktree add --detach "${RUNNER_TEMP}/benchmark-base" "$BASE_SHA"

      - name: Build missing pull-request base binaries
        if: github.event_name == 'pull_request' && ((steps.benchmark-change.outputs.parser_changed == 'true' && steps.parser-base-cache.outputs.cache-hit != 'true') || (steps.benchmark-change.outputs.syntax_changed == 'true' && steps.syntax-base-cache.outputs.cache-hit != 'true'))
        env:
          PARSER_BASE_CACHE_HIT: ${{ steps.parser-base-cache.outputs.cache-hit }}
          SYNTAX_BASE_CACHE_HIT: ${{ steps.syntax-base-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          pids=()
          labels=()

          if [[ "$BENCH_PARSER_CHANGED" == true && "$PARSER_BASE_CACHE_HIT" != true ]]; then
            (
              CARGO_TARGET_DIR="${RUNNER_TEMP}/bench-target-base-parser" \
                cargo build --release \
                  --manifest-path "${RUNNER_TEMP}/benchmark-base/Cargo.toml" \
                  --bin stream-bench
              bin_dir="${RUNNER_TEMP}/bench-bin-parser-${BENCH_PARSER_BASE_HASH}"
              mkdir -p "$bin_dir"
              cp "${RUNNER_TEMP}/bench-target-base-parser/release/stream-bench" "$bin_dir/stream-bench"
            ) &
            pids+=("$!")
            labels+=(parser-base)
          fi

          if [[ "$BENCH_SYNTAX_CHANGED" == true && "$SYNTAX_BASE_CACHE_HIT" != true ]]; then
            (
              CARGO_TARGET_DIR="${RUNNER_TEMP}/bench-target-base-syntax" \
                cargo build --release \
                  --manifest-path "${RUNNER_TEMP}/benchmark-base/tools/syntax-bench/Cargo.toml"
              bin_dir="${RUNNER_TEMP}/bench-bin-syntax-${BENCH_SYNTAX_BASE_HASH}"
              mkdir -p "$bin_dir"
              cp "${RUNNER_TEMP}/bench-target-base-syntax/release/syntax-bench" "$bin_dir/syntax-bench"
            ) &
            pids+=("$!")
            labels+=(syntax-base)
          fi

          failed=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "::error::${labels[$i]} benchmark build failed"
              failed=1
            fi
          done
          exit "$failed"

      - name: Warm benchmark binaries
        if: steps.benchmark-change.outputs.changed == 'true' && github.event_name != 'pull_request'
        run: |
          if [[ "$BENCH_PARSER_CHANGED" == true ]]; then
            "${RUNNER_TEMP}/bench-bin-parser-${BENCH_PARSER_HEAD_HASH}/stream-bench" > /dev/null
          fi
          if [[ "$BENCH_SYNTAX_CHANGED" == true ]]; then
            SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" \
              "${RUNNER_TEMP}/bench-bin-syntax-${BENCH_SYNTAX_HEAD_HASH}/syntax-bench" > /dev/null
          fi

      - name: Warm paired pull-request binaries
        if: steps.benchmark-change.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          if [[ "$BENCH_PARSER_CHANGED" == true ]]; then
            "${RUNNER_TEMP}/bench-bin-parser-${BENCH_PARSER_BASE_HASH}/stream-bench" > /dev/null
            "${RUNNER_TEMP}/bench-bin-parser-${BENCH_PARSER_HEAD_HASH}/stream-bench" > /dev/null
          fi
          if [[ "$BENCH_SYNTAX_CHANGED" == true ]]; then
            SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" \
              "${RUNNER_TEMP}/bench-bin-syntax-${BENCH_SYNTAX_BASE_HASH}/syntax-bench" > /dev/null
            SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" \
              "${RUNNER_TEMP}/bench-bin-syntax-${BENCH_SYNTAX_HEAD_HASH}/syntax-bench" > /dev/null
          fi

      - name: Run local samples
        if: steps.benchmark-change.outputs.changed == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          log="$GITHUB_WORKSPACE/benchmark-samples.log"
          : > "$log"
          for ((i = 1; i <= BENCH_RUNS; i++)); do
            if [[ "$BENCH_PARSER_CHANGED" == true ]]; then
              "${RUNNER_TEMP}/bench-bin-parser-${BENCH_PARSER_HEAD_HASH}/stream-bench" >> "$log"
            fi
            if [[ "$BENCH_SYNTAX_CHANGED" == true ]]; then
              SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" \
                "${RUNNER_TEMP}/bench-bin-syntax-${BENCH_SYNTAX_HEAD_HASH}/syntax-bench" >> "$log"
            fi
          done
          python3 scripts/bench-to-bmf.py \
            benchmark-samples.log \
            benchmark-results.bmf.json \
            --summary benchmark-summary.md
          cat benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run paired pull-request samples
        if: steps.benchmark-change.outputs.changed == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          head_log="$GITHUB_WORKSPACE/benchmark-samples.log"
          base_log="$GITHUB_WORKSPACE/benchmark-base-samples.log"
          : > "$head_log"
          : > "$base_log"

          run_head() {
            if [[ "$BENCH_PARSER_CHANGED" == true ]]; then
              "${RUNNER_TEMP}/bench-bin-parser-${BENCH_PARSER_HEAD_HASH}/stream-bench" >> "$head_log"
            fi
            if [[ "$BENCH_SYNTAX_CHANGED" == true ]]; then
              SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" \
                "${RUNNER_TEMP}/bench-bin-syntax-${BENCH_SYNTAX_HEAD_HASH}/syntax-bench" >> "$head_log"
            fi
          }
          run_base() {
            if [[ "$BENCH_PARSER_CHANGED" == true ]]; then
              "${RUNNER_TEMP}/bench-bin-parser-${BENCH_PARSER_BASE_HASH}/stream-bench" >> "$base_log"
            fi
            if [[ "$BENCH_SYNTAX_CHANGED" == true ]]; then
              SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" \
                "${RUNNER_TEMP}/bench-bin-syntax-${BENCH_SYNTAX_BASE_HASH}/syntax-bench" >> "$base_log"
            fi
          }

          for ((i = 1; i <= BENCH_RUNS; i++)); do
            if ((i % 2)); then
              run_base
              run_head
            else
              run_head
              run_base
            fi
          done

          python3 scripts/bench-to-bmf.py \
            benchmark-base-samples.log \
            benchmark-base-results.bmf.json \
            --summary benchmark-base-summary.md
          python3 scripts/bench-to-bmf.py \
            benchmark-samples.log \
            benchmark-results.bmf.json \
            --summary benchmark-summary.md
          {
            echo '## Base on the same runner'
            cat benchmark-base-summary.md
            echo
            echo '## Pull request head on the same runner'
            cat benchmark-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Track main benchmarks with Bencher
        if: steps.benchmark-change.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          bencher run \
            --project "$BENCHER_PROJECT" \
            --key "$BENCHER_API_KEY" \
            --branch main \
            --hash "$GITHUB_SHA" \
            --testbed "$BENCHER_TESTBED" \
            --threshold-measure mib-per-second \
            --threshold-test percentage \
            --threshold-min-sample-size 3 \
            --threshold-max-sample-size 8 \
            --threshold-lower-boundary 0.10 \
            --thresholds-reset \
            --adapter json \
            --file benchmark-results.bmf.json

      - name: Track paired pull-request benchmarks with Bencher
        if: steps.benchmark-change.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base_branch="pr-${PR_NUMBER}-base"
          head_branch="pr-${PR_NUMBER}"

          bencher run \
            --project "$BENCHER_PROJECT" \
            --key "$BENCHER_API_KEY" \
            --branch "$base_branch" \
            --hash "$BASE_SHA" \
            --start-point-reset \
            --testbed "$BENCHER_TESTBED" \
            --threshold-measure mib-per-second \
            --threshold-test percentage \
            --threshold-min-sample-size 1 \
            --threshold-max-sample-size 1 \
            --threshold-lower-boundary 0.10 \
            --thresholds-reset \
            --adapter json \
            --file benchmark-base-results.bmf.json

          bencher run \
            --project "$BENCHER_PROJECT" \
            --key "$BENCHER_API_KEY" \
            --branch "$head_branch" \
            --hash "$HEAD_SHA" \
            --start-point "$base_branch" \
            --start-point-hash "$BASE_SHA" \
            --start-point-clone-thresholds \
            --start-point-reset \
            --testbed "$BENCHER_TESTBED" \
            --error-on-alert \
            --adapter json \
            --file benchmark-results.bmf.json \
            --github-actions "$GITHUB_TOKEN" \
            --ci-number "$PR_NUMBER" \
            --ci-public-links

      - name: Note fork PR limitation
        if: steps.benchmark-change.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo '### Bencher upload skipped' >> "$GITHUB_STEP_SUMMARY"
          echo 'Fork pull requests do not receive repository secrets. Paired base/head measurements still run locally and are kept as an artifact.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw benchmark samples
        if: always() && steps.benchmark-change.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-samples-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            benchmark-samples.log
            benchmark-results.bmf.json
            benchmark-summary.md
            benchmark-base-samples.log
            benchmark-base-results.bmf.json
            benchmark-base-summary.md

  archive-pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect whether benchmark branches were created
        id: archive-needed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          parser_base_hash="$(python3 scripts/benchmark-input-hash.py . --commit "$BASE_SHA" --suite parser)"
          parser_head_hash="$(python3 scripts/benchmark-input-hash.py . --commit "$HEAD_SHA" --suite parser)"
          syntax_base_hash="$(python3 scripts/benchmark-input-hash.py . --commit "$BASE_SHA" --suite syntax)"
          syntax_head_hash="$(python3 scripts/benchmark-input-hash.py . --commit "$HEAD_SHA" --suite syntax)"
          if [[ "$parser_base_hash" == "$parser_head_hash" && "$syntax_base_hash" == "$syntax_head_hash" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Bencher CLI
        if: steps.archive-needed.outputs.needed == 'true'
        uses: bencherdev/bencher@v0.6.12

      - name: Resolve Bencher project
        if: steps.archive-needed.outputs.needed == 'true'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          project="$(python3 scripts/resolve-bencher-project.py)"
          echo "BENCHER_PROJECT=$project" >> "$GITHUB_ENV"

      - name: Archive closed PR branches with Bencher
        if: steps.archive-needed.outputs.needed == 'true'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bencher archive \
            --project "$BENCHER_PROJECT" \
            --key "$BENCHER_API_KEY" \
            --branch "pr-${PR_NUMBER}"
          bencher archive \
            --project "$BENCHER_PROJECT" \
            --key "$BENCHER_API_KEY" \
            --branch "pr-${PR_NUMBER}-base"
