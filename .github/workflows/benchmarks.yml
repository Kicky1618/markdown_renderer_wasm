name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, edited, synchronize, closed]
  workflow_dispatch:
    inputs:
      runs:
        description: Repetitions used for the local median
        required: false
        default: "7"

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCH_RUNS: ${{ inputs.runs || '7' }}
      SYNTAX_BENCH_BYTES: "4194304"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Compute Rust cache key
        id: rust-cache
        run: |
          tag="$(rustc -vV | sha256sum | cut -c1-16)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore benchmark build cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ runner.temp }}/bench-target-root
            ${{ runner.temp }}/bench-target-syntax
          key: bench-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.tag }}-${{ hashFiles('Cargo.lock', 'tools/syntax-bench/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            bench-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.tag }}-${{ hashFiles('Cargo.lock', 'tools/syntax-bench/Cargo.lock') }}-

      - name: Install Bencher CLI
        uses: bencherdev/bencher@v0.6.12

      - name: Require Bencher API key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: test -n "$BENCHER_API_KEY"

      - name: Resolve Bencher project
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          project="$(python3 scripts/resolve-bencher-project.py)"
          echo "Resolved Bencher project: $project"
          echo "BENCHER_PROJECT=$project" >> "$GITHUB_ENV"

      - name: Resolve benchmark testbed
        run: |
          testbed="$(python3 scripts/resolve-bencher-testbed.py)"
          echo "Bencher testbed: $testbed"
          echo "BENCHER_TESTBED=$testbed" >> "$GITHUB_ENV"

      - name: Build benchmark binaries
        run: |
          CARGO_TARGET_DIR="${RUNNER_TEMP}/bench-target-root" \
            cargo build --release --bin stream-bench
          CARGO_TARGET_DIR="${RUNNER_TEMP}/bench-target-syntax" \
            cargo build --release --manifest-path tools/syntax-bench/Cargo.toml

      - name: Prepare pull-request base binaries
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "${RUNNER_TEMP}/benchmark-base" "$BASE_SHA"
          CARGO_TARGET_DIR="${RUNNER_TEMP}/bench-target-base-root" \
            cargo build --release \
              --manifest-path "${RUNNER_TEMP}/benchmark-base/Cargo.toml" \
              --bin stream-bench
          CARGO_TARGET_DIR="${RUNNER_TEMP}/bench-target-base-syntax" \
            cargo build --release \
              --manifest-path "${RUNNER_TEMP}/benchmark-base/tools/syntax-bench/Cargo.toml"

      - name: Warm benchmark binaries
        if: github.event_name != 'pull_request'
        run: |
          "${RUNNER_TEMP}/bench-target-root/release/stream-bench" > /dev/null
          SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" \
            "${RUNNER_TEMP}/bench-target-syntax/release/syntax-bench" > /dev/null

      - name: Warm paired pull-request binaries
        if: github.event_name == 'pull_request'
        run: |
          "${RUNNER_TEMP}/bench-target-base-root/release/stream-bench" > /dev/null
          SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" \
            "${RUNNER_TEMP}/bench-target-base-syntax/release/syntax-bench" > /dev/null
          "${RUNNER_TEMP}/bench-target-root/release/stream-bench" > /dev/null
          SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" \
            "${RUNNER_TEMP}/bench-target-syntax/release/syntax-bench" > /dev/null

      - name: Run local samples
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          log="$GITHUB_WORKSPACE/benchmark-samples.log"
          : > "$log"
          for ((i = 1; i <= BENCH_RUNS; i++)); do
            "${RUNNER_TEMP}/bench-target-root/release/stream-bench" >> "$log"
            SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" \
              "${RUNNER_TEMP}/bench-target-syntax/release/syntax-bench" >> "$log"
          done
          python3 scripts/bench-to-bmf.py \
            benchmark-samples.log \
            benchmark-results.bmf.json \
            --summary benchmark-summary.md
          cat benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run paired pull-request samples
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          head_log="$GITHUB_WORKSPACE/benchmark-samples.log"
          base_log="$GITHUB_WORKSPACE/benchmark-base-samples.log"
          : > "$head_log"
          : > "$base_log"

          run_head() {
            "${RUNNER_TEMP}/bench-target-root/release/stream-bench" >> "$head_log"
            SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" \
              "${RUNNER_TEMP}/bench-target-syntax/release/syntax-bench" >> "$head_log"
          }
          run_base() {
            "${RUNNER_TEMP}/bench-target-base-root/release/stream-bench" >> "$base_log"
            SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" \
              "${RUNNER_TEMP}/bench-target-base-syntax/release/syntax-bench" >> "$base_log"
          }

          for ((i = 1; i <= BENCH_RUNS; i++)); do
            if ((i % 2)); then
              run_base
              run_head
            else
              run_head
              run_base
            fi
          done

          python3 scripts/bench-to-bmf.py \
            benchmark-base-samples.log \
            benchmark-base-results.bmf.json \
            --summary benchmark-base-summary.md
          python3 scripts/bench-to-bmf.py \
            benchmark-samples.log \
            benchmark-results.bmf.json \
            --summary benchmark-summary.md
          {
            echo '## Base on the same runner'
            cat benchmark-base-summary.md
            echo
            echo '## Pull request head on the same runner'
            cat benchmark-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Track main benchmarks with Bencher
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          bencher run \
            --project "$BENCHER_PROJECT" \
            --key "$BENCHER_API_KEY" \
            --branch main \
            --hash "$GITHUB_SHA" \
            --testbed "$BENCHER_TESTBED" \
            --threshold-measure mib-per-second \
            --threshold-test percentage \
            --threshold-min-sample-size 3 \
            --threshold-max-sample-size 8 \
            --threshold-lower-boundary 0.10 \
            --thresholds-reset \
            --error-on-alert \
            --adapter json \
            --file benchmark-results.bmf.json \
            --github-actions "$GITHUB_TOKEN" \
            --ci-public-links

      - name: Track paired pull-request benchmarks with Bencher
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base_branch="pr-${PR_NUMBER}-base"
          head_branch="pr-${PR_NUMBER}"

          bencher run \
            --project "$BENCHER_PROJECT" \
            --key "$BENCHER_API_KEY" \
            --branch "$base_branch" \
            --hash "$BASE_SHA" \
            --start-point-reset \
            --testbed "$BENCHER_TESTBED" \
            --threshold-measure mib-per-second \
            --threshold-test percentage \
            --threshold-min-sample-size 1 \
            --threshold-max-sample-size 1 \
            --threshold-lower-boundary 0.10 \
            --thresholds-reset \
            --adapter json \
            --file benchmark-base-results.bmf.json

          bencher run \
            --project "$BENCHER_PROJECT" \
            --key "$BENCHER_API_KEY" \
            --branch "$head_branch" \
            --hash "$HEAD_SHA" \
            --start-point "$base_branch" \
            --start-point-hash "$BASE_SHA" \
            --start-point-clone-thresholds \
            --start-point-reset \
            --testbed "$BENCHER_TESTBED" \
            --error-on-alert \
            --adapter json \
            --file benchmark-results.bmf.json \
            --github-actions "$GITHUB_TOKEN" \
            --ci-number "$PR_NUMBER" \
            --ci-public-links

      - name: Note fork PR limitation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo '### Bencher upload skipped' >> "$GITHUB_STEP_SUMMARY"
          echo 'Fork pull requests do not receive repository secrets. Paired base/head measurements still run locally and are kept as an artifact.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw benchmark samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-samples-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            benchmark-samples.log
            benchmark-results.bmf.json
            benchmark-summary.md
            benchmark-base-samples.log
            benchmark-base-results.bmf.json
            benchmark-base-summary.md

  archive-pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bencher CLI
        uses: bencherdev/bencher@v0.6.12

      - name: Resolve Bencher project
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          project="$(python3 scripts/resolve-bencher-project.py)"
          echo "BENCHER_PROJECT=$project" >> "$GITHUB_ENV"

      - name: Archive closed PR branches with Bencher
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bencher archive \
            --project "$BENCHER_PROJECT" \
            --key "$BENCHER_API_KEY" \
            --branch "pr-${PR_NUMBER}"
          bencher archive \
            --project "$BENCHER_PROJECT" \
            --key "$BENCHER_API_KEY" \
            --branch "pr-${PR_NUMBER}-base"
