name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      runs:
        description: Repetitions used for the local median
        required: false
        default: "7"

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCH_RUNS: ${{ inputs.runs || '7' }}
      SYNTAX_BENCH_BYTES: "4194304"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Detect benchmark-relevant changes
        id: benchmark-change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          head_hash="$(python3 scripts/benchmark-input-hash.py . --commit "$head_sha")"
          base_sha=""
          base_hash=""
          changed=true

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              ;;
            push)
              base_sha="$PUSH_BEFORE_SHA"
              if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
                base_sha=""
              fi
              ;;
            workflow_dispatch)
              # Manual runs are explicit benchmark requests and always execute.
              base_sha=""
              ;;
          esac

          if [[ -n "$base_sha" ]]; then
            git fetch --no-tags --depth=1 origin "$base_sha"
            base_hash="$(python3 scripts/benchmark-input-hash.py . --commit "$base_sha")"
            if [[ "$head_hash" == "$base_hash" ]]; then
              changed=false
            fi
          fi

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_hash=$head_hash" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "base_hash=$base_hash" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "BENCH_HEAD_HASH=$head_hash" >> "$GITHUB_ENV"
          echo "BENCH_BASE_HASH=$base_hash" >> "$GITHUB_ENV"
          echo "Benchmark input: head=$head_hash base=${base_hash:-none} changed=$changed"

      - name: Skip unchanged benchmark inputs
        if: steps.benchmark-change.outputs.changed != 'true'
        run: |
          {
            echo '## Benchmarks skipped'
            echo
            echo 'The benchmark-relevant source hash is identical to the base revision.'
            echo 'No compilation, measurement, Bencher metric, or artifact was produced for this revision.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select stable Rust
        if: steps.benchmark-change.outputs.changed == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Compute Rust cache key
        if: steps.benchmark-change.outputs.changed == 'true'
        id: rust-cache
        run: |
          tag="$(rustc -vV | sha256sum | cut -c1-16)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore benchmark binary cache
        if: steps.benchmark-change.outputs.changed == 'true'
        id: head-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/bench-bin-${{ steps.benchmark-change.outputs.head_hash }}
          key: bench-bin-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.tag }}-${{ steps.benchmark-change.outputs.head_hash }}

      - name: Install Bencher CLI
        if: steps.benchmark-change.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: bencherdev/bencher@v0.6.12

      - name: Require Bencher API key
        if: steps.benchmark-change.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: test -n "$BENCHER_API_KEY"

      - name: Resolve Bencher project
        if: steps.benchmark-change.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          project="$(python3 scripts/resolve-bencher-project.py)"
          echo "Resolved Bencher project: $project"
          echo "BENCHER_PROJECT=$project" >> "$GITHUB_ENV"

      - name: Resolve benchmark testbed
        if: steps.benchmark-change.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          testbed="$(python3 scripts/resolve-bencher-testbed.py)"
          echo "Bencher testbed: $testbed"
          echo "BENCHER_TESTBED=$testbed" >> "$GITHUB_ENV"

      - name: Build benchmark binaries
        if: steps.benchmark-change.outputs.changed == 'true' && steps.head-cache.outputs.cache-hit != 'true'
        run: |
          CARGO_TARGET_DIR="${RUNNER_TEMP}/bench-target-root" \
            cargo build --release --bin stream-bench
          CARGO_TARGET_DIR="${RUNNER_TEMP}/bench-target-syntax" \
            cargo build --release --manifest-path tools/syntax-bench/Cargo.toml
          bin_dir="${RUNNER_TEMP}/bench-bin-${BENCH_HEAD_HASH}"
          mkdir -p "$bin_dir"
          cp "${RUNNER_TEMP}/bench-target-root/release/stream-bench" "$bin_dir/stream-bench"
          cp "${RUNNER_TEMP}/bench-target-syntax/release/syntax-bench" "$bin_dir/syntax-bench"

      - name: Restore pull-request base binary cache
        if: steps.benchmark-change.outputs.changed == 'true' && github.event_name == 'pull_request'
        id: base-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/bench-bin-${{ steps.benchmark-change.outputs.base_hash }}
          key: bench-bin-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.tag }}-${{ steps.benchmark-change.outputs.base_hash }}

      - name: Build pull-request base binaries
        if: steps.benchmark-change.outputs.changed == 'true' && github.event_name == 'pull_request' && steps.base-cache.outputs.cache-hit != 'true'
        env:
          BASE_SHA: ${{ steps.benchmark-change.outputs.base_sha }}
        run: |
          git worktree add --detach "${RUNNER_TEMP}/benchmark-base" "$BASE_SHA"
          CARGO_TARGET_DIR="${RUNNER_TEMP}/bench-target-base-root" \
            cargo build --release \
              --manifest-path "${RUNNER_TEMP}/benchmark-base/Cargo.toml" \
              --bin stream-bench
          CARGO_TARGET_DIR="${RUNNER_TEMP}/bench-target-base-syntax" \
            cargo build --release \
              --manifest-path "${RUNNER_TEMP}/benchmark-base/tools/syntax-bench/Cargo.toml"
          bin_dir="${RUNNER_TEMP}/bench-bin-${BENCH_BASE_HASH}"
          mkdir -p "$bin_dir"
          cp "${RUNNER_TEMP}/bench-target-base-root/release/stream-bench" "$bin_dir/stream-bench"
          cp "${RUNNER_TEMP}/bench-target-base-syntax/release/syntax-bench" "$bin_dir/syntax-bench"

      - name: Warm benchmark binaries
        if: steps.benchmark-change.outputs.changed == 'true' && github.event_name != 'pull_request'
        run: |
          bin_dir="${RUNNER_TEMP}/bench-bin-${BENCH_HEAD_HASH}"
          "$bin_dir/stream-bench" > /dev/null
          SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" "$bin_dir/syntax-bench" > /dev/null

      - name: Warm paired pull-request binaries
        if: steps.benchmark-change.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          base_dir="${RUNNER_TEMP}/bench-bin-${BENCH_BASE_HASH}"
          head_dir="${RUNNER_TEMP}/bench-bin-${BENCH_HEAD_HASH}"
          "$base_dir/stream-bench" > /dev/null
          SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" "$base_dir/syntax-bench" > /dev/null
          "$head_dir/stream-bench" > /dev/null
          SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" "$head_dir/syntax-bench" > /dev/null

      - name: Run local samples
        if: steps.benchmark-change.outputs.changed == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          log="$GITHUB_WORKSPACE/benchmark-samples.log"
          bin_dir="${RUNNER_TEMP}/bench-bin-${BENCH_HEAD_HASH}"
          : > "$log"
          for ((i = 1; i <= BENCH_RUNS; i++)); do
            "$bin_dir/stream-bench" >> "$log"
            SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" "$bin_dir/syntax-bench" >> "$log"
          done
          python3 scripts/bench-to-bmf.py \
            benchmark-samples.log \
            benchmark-results.bmf.json \
            --summary benchmark-summary.md
          cat benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run paired pull-request samples
        if: steps.benchmark-change.outputs.changed == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          head_log="$GITHUB_WORKSPACE/benchmark-samples.log"
          base_log="$GITHUB_WORKSPACE/benchmark-base-samples.log"
          head_dir="${RUNNER_TEMP}/bench-bin-${BENCH_HEAD_HASH}"
          base_dir="${RUNNER_TEMP}/bench-bin-${BENCH_BASE_HASH}"
          : > "$head_log"
          : > "$base_log"

          run_head() {
            "$head_dir/stream-bench" >> "$head_log"
            SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" "$head_dir/syntax-bench" >> "$head_log"
          }
          run_base() {
            "$base_dir/stream-bench" >> "$base_log"
            SYNTAX_BENCH_BYTES="$SYNTAX_BENCH_BYTES" "$base_dir/syntax-bench" >> "$base_log"
          }

          for ((i = 1; i <= BENCH_RUNS; i++)); do
            if ((i % 2)); then
              run_base
              run_head
            else
              run_head
              run_base
            fi
          done

          python3 scripts/bench-to-bmf.py \
            benchmark-base-samples.log \
            benchmark-base-results.bmf.json \
            --summary benchmark-base-summary.md
          python3 scripts/bench-to-bmf.py \
            benchmark-samples.log \
            benchmark-results.bmf.json \
            --summary benchmark-summary.md
          {
            echo '## Base on the same runner'
            cat benchmark-base-summary.md
            echo
            echo '## Pull request head on the same runner'
            cat benchmark-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Track main benchmarks with Bencher
        if: steps.benchmark-change.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          bencher run \
            --project "$BENCHER_PROJECT" \
            --key "$BENCHER_API_KEY" \
            --branch main \
            --hash "$GITHUB_SHA" \
            --testbed "$BENCHER_TESTBED" \
            --threshold-measure mib-per-second \
            --threshold-test percentage \
            --threshold-min-sample-size 3 \
            --threshold-max-sample-size 8 \
            --threshold-lower-boundary 0.10 \
            --thresholds-reset \
            --adapter json \
            --file benchmark-results.bmf.json

      - name: Track paired pull-request benchmarks with Bencher
        if: steps.benchmark-change.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base_branch="pr-${PR_NUMBER}-base"
          head_branch="pr-${PR_NUMBER}"

          bencher run \
            --project "$BENCHER_PROJECT" \
            --key "$BENCHER_API_KEY" \
            --branch "$base_branch" \
            --hash "$BASE_SHA" \
            --start-point-reset \
            --testbed "$BENCHER_TESTBED" \
            --threshold-measure mib-per-second \
            --threshold-test percentage \
            --threshold-min-sample-size 1 \
            --threshold-max-sample-size 1 \
            --threshold-lower-boundary 0.10 \
            --thresholds-reset \
            --adapter json \
            --file benchmark-base-results.bmf.json

          bencher run \
            --project "$BENCHER_PROJECT" \
            --key "$BENCHER_API_KEY" \
            --branch "$head_branch" \
            --hash "$HEAD_SHA" \
            --start-point "$base_branch" \
            --start-point-hash "$BASE_SHA" \
            --start-point-clone-thresholds \
            --start-point-reset \
            --testbed "$BENCHER_TESTBED" \
            --error-on-alert \
            --adapter json \
            --file benchmark-results.bmf.json \
            --github-actions "$GITHUB_TOKEN" \
            --ci-number "$PR_NUMBER" \
            --ci-public-links

      - name: Note fork PR limitation
        if: steps.benchmark-change.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo '### Bencher upload skipped' >> "$GITHUB_STEP_SUMMARY"
          echo 'Fork pull requests do not receive repository secrets. Paired base/head measurements still run locally and are kept as an artifact.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw benchmark samples
        if: always() && steps.benchmark-change.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-samples-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            benchmark-samples.log
            benchmark-results.bmf.json
            benchmark-summary.md
            benchmark-base-samples.log
            benchmark-base-results.bmf.json
            benchmark-base-summary.md

  archive-pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect whether benchmark branches were created
        id: archive-needed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          base_hash="$(python3 scripts/benchmark-input-hash.py . --commit "$BASE_SHA")"
          head_hash="$(python3 scripts/benchmark-input-hash.py . --commit "$HEAD_SHA")"
          if [[ "$base_hash" == "$head_hash" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Bencher CLI
        if: steps.archive-needed.outputs.needed == 'true'
        uses: bencherdev/bencher@v0.6.12

      - name: Resolve Bencher project
        if: steps.archive-needed.outputs.needed == 'true'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          project="$(python3 scripts/resolve-bencher-project.py)"
          echo "BENCHER_PROJECT=$project" >> "$GITHUB_ENV"

      - name: Archive closed PR branches with Bencher
        if: steps.archive-needed.outputs.needed == 'true'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bencher archive \
            --project "$BENCHER_PROJECT" \
            --key "$BENCHER_API_KEY" \
            --branch "pr-${PR_NUMBER}"
          bencher archive \
            --project "$BENCHER_PROJECT" \
            --key "$BENCHER_API_KEY" \
            --branch "pr-${PR_NUMBER}-base"
