<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>langpack probe</title></head>
<body>
<canvas id="app" width="320" height="180"></canvas>
<script type="module">
  import init from "../pkg/streamdown_web.js";
  import { loadLanguagePack } from "../language-loader.js";

  const root = document.documentElement;
  root.dataset.langpackProbe = "running";
  try {
    await init();
    const flood = await Promise.all(
      Array.from({ length: 160 }, (_, i) => loadLanguagePack(`missing-${String(i).padStart(3, "0")}`))
    );
    const first = await loadLanguagePack("typescript");
    const duplicate = await loadLanguagePack("ts");
    delete root.dataset.languagePackError;
    const concurrentAliases = await Promise.all([loadLanguagePack("c++"), loadLanguagePack("cpp")]);
    const concurrentOk = concurrentAliases.filter(Boolean).length === 1 && !root.dataset.languagePackError;
    const unsafe = await loadLanguagePack("../unsafe-probe");
    const queuedLanguages = [
      "rust", "python", "shell", "java", "go", "json", "css", "sql", "yaml", "toml",
      "kotlin", "csharp", "ruby", "haskell", "verilog", "wgsl", "terraform", "powershell", "swift", "zig",
    ];
    const queued = await Promise.all(queuedLanguages.map(loadLanguagePack));
    const queuedOk = queued.every(Boolean);
    root.dataset.langpackProbe = flood.every(value => !value) && first && !duplicate && concurrentOk && !unsafe && queuedOk ? "pass" : "fail";
    root.dataset.langpackFloodSuccesses = String(flood.filter(Boolean).length);
    root.dataset.langpackFirst = String(first);
    root.dataset.langpackDuplicate = String(duplicate);
    root.dataset.langpackConcurrent = concurrentAliases.join(",");
    root.dataset.langpackQueued = `${queued.filter(Boolean).length}/${queued.length}`;
    root.dataset.langpackUnsafe = String(unsafe);
  } catch (error) {
    root.dataset.langpackProbe = "error";
    root.dataset.langpackError = String(error);
    console.error(error);
  }
</script>
</body>
</html>
